<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aragón en línea | Prototipo plataforma de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#18231F; --muted:#5B6862; --line:#D9E2DD;
  --primary:#0F4C45; --primary-soft:#E2EEEA; --sun:#E8B931; --sun-ink:#3B2E05;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B42318;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#16201D; --ink:#E6EEEA; --muted:#9AA9A2; --line:#2A3632;
    --primary:#5FB8A9; --primary-soft:#1D2E2A; --sun:#E8B931; --sun-ink:#2B2104;
    --ok:#5CC08A; --warn:#E0A94A; --bad:#F07A6E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --ink:#E6EEEA; --muted:#9AA9A2; --line:#2A3632;
  --primary:#5FB8A9; --primary-soft:#1D2E2A; --sun:#E8B931; --sun-ink:#2B2104;
  --ok:#5CC08A; --warn:#E0A94A; --bad:#F07A6E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.demo{background:var(--sun);color:var(--sun-ink);font-size:13px;font-weight:600;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo button{background:transparent;border:1.5px solid var(--sun-ink);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600;color:var(--sun-ink)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 40px)}
aside{background:var(--primary);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] aside{background:#0B3A34}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#0B3A34}}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75;letter-spacing:0}
.role{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;color:#fff;padding:7px 6px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.role button.on{background:#fff;color:#0F4C45}
nav{display:flex;flex-direction:column;gap:2px}
nav button{background:transparent;border:0;color:rgba(255,255,255,.82);text-align:left;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--sun)}
.badge{background:var(--sun);color:var(--sun-ink);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.unit{margin-top:auto;font-size:13px;opacity:.8}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1100px;width:100%}
h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.025em;line-height:1.15;margin:0 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px;max-width:70ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.hero{background:var(--primary);color:#fff;border-radius:var(--r-lg);padding:26px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end;margin-bottom:16px}
:root[data-theme="dark"] .hero{background:#0B3A34}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#0B3A34}}
.hero .amt{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero p{margin:6px 0 0;opacity:.85}
.hero .aviso{background:var(--sun);color:var(--sun-ink);border-radius:var(--r-md);padding:14px 16px;font-weight:600}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:13px}
.btn{background:var(--primary);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0B1F1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0B1F1B}}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.list{display:flex;flex-direction:column}
.item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.item:first-child{border-top:0;padding-top:0}
.item .t{font-weight:700}
.item .m{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.p-info{background:var(--primary-soft);color:var(--primary)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--primary-soft);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--primary)}
.code{font-size:26px;font-weight:800;letter-spacing:.15em;color:var(--primary)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px;cursor:pointer;text-align:center;font-weight:600;font-size:13px}
.slot.taken{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.slot.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-md);font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.modal .panel{max-width:460px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:18px 0}
.mobnav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside,main{min-width:0}
  .portada svg.escena{height:62%}
  aside{position:static;height:auto;padding:16px;gap:12px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav button{white-space:nowrap;padding:8px 12px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--sun)}
  .unit{display:none}
  .hero{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.portada{position:relative;border-radius:22px;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;margin-bottom:20px;background:#BFE3DA}
.portada svg.escena{position:absolute;inset:0;width:100%;height:100%}
.portada::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,40,36,.82) 0%,rgba(8,40,36,.55) 42%,rgba(8,40,36,0) 70%)}
.portada-txt{position:relative;z-index:1;color:#fff;padding:32px clamp(20px,4vw,40px);max-width:560px}
.saludo{margin:0 0 6px;font-weight:600;opacity:.9}
.titular{font-size:clamp(32px,5.2vw,56px);line-height:1.02;letter-spacing:-.035em;margin:0;color:#fff}
.lema{margin:12px 0 0;font-size:16px;opacity:.9;max-width:44ch}
.btn.sol{background:var(--sun);color:var(--sun-ink)}
.btn.claro{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.saldo-card{position:absolute;z-index:1;right:20px;top:20px;background:rgba(255,255,255,.94);color:#18231F;border-radius:16px;padding:14px 18px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.saldo-card .m{font-size:13px;color:#5B6862}
.saldo-card .amt{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.accesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:8px}
.accesos button{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.accesos button:hover{border-left-color:var(--sun)}
.accesos b{font-size:16px}
.accesos span{color:var(--muted);font-size:13px}
h2.sec{font-size:22px;letter-spacing:-.02em;margin:32px 0 14px}
.gal{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:180px;gap:12px}
.gal .ph{margin:0;position:relative;border-radius:16px;overflow:hidden;background:var(--primary-soft);grid-column:span 2}
.gal .ph:first-child{grid-column:span 4;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .capv{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-weight:600;font-size:13px}
.gal .ph figcaption:not(.capv){position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.gal .ph figcaption input{padding:6px 8px;font-size:13px}
.phv{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;color:var(--primary);font-weight:600;font-size:13px;padding-top:14px}
.gal .ph:first-child .phv{justify-content:center;padding:0 0 80px}
.phv svg{width:44px;height:44px;opacity:.7}
.cal{min-width:52px;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:10px;padding:6px 4px;line-height:1.1}
.cal b{display:block;font-size:20px}
.cal span{font-size:12px;font-weight:600}
.zonas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.zona{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;color:#fff}
.zona svg{width:46px;height:46px;flex:none}
.zona b{display:block;font-size:16px}
.zona span{font-size:13px;opacity:.9}
.z0{background:#0F4C45}.z1{background:#1F6B5C}.z2{background:#1B6E8A}.z3{background:#5B7F2E}
.directorio{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.directorio div{display:flex;flex-direction:column}
.directorio span{color:var(--muted);font-size:14px}
.nota{margin-bottom:8px;border-left:4px solid var(--sun)}
@media (max-width:860px){
  .portada{min-height:460px;align-items:flex-end}
  .portada::after{background:linear-gradient(0deg,rgba(8,40,36,.88) 0%,rgba(8,40,36,.5) 55%,rgba(8,40,36,0) 85%)}
  .saldo-card{position:relative;right:auto;top:auto;margin:0 20px 20px;align-self:flex-end}
  .portada{flex-direction:column;align-items:stretch;justify-content:flex-end}
  .gal{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}
  .gal .ph,.gal .ph:first-child{grid-column:span 1;grid-row:span 1}
  .gal .ph:first-child{grid-column:span 2;grid-row:span 2}
}
</style>

const FKEY="aragon-proto-fotos";
let FOTOS;
try{FOTOS=JSON.parse(localStorage.getItem(FKEY))||[]}catch(e){FOTOS=[]}
while(FOTOS.length<6)FOTOS.push(null);
function saveFotos(){try{localStorage.setItem(FKEY,JSON.stringify(FOTOS));return true}catch(e){return false}}
function reducir(file){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.onerror=fail;im.src=r.result};r.onerror=fail;r.readAsDataURL(file)})}
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.foto!==undefined&&t.files&&t.files[0]){
    const i=+t.dataset.foto;
    try{const src=await reducir(t.files[0]);const prev=FOTOS[i];FOTOS[i]={src,cap:(prev&&prev.cap)||""};
      if(!saveFotos()){FOTOS[i]=prev;toast("La foto no cabe en el almacenamiento del navegador. Quite otra foto e intente de nuevo.");}else toast("Foto cargada");
    }catch(err){toast("No se pudo leer la imagen. Use un archivo JPG o PNG.")}
    render();
  }
  if(t.dataset&&t.dataset.cap!==undefined){const i=+t.dataset.cap;FOTOS[i]=FOTOS[i]||{src:"",cap:""};FOTOS[i].cap=t.value.trim();saveFotos();}
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-delfoto]");if(b){FOTOS[+b.dataset.delfoto]=null;saveFotos();render();toast("Foto quitada")}});

function renderNav(){

  const abiertas=S.pqrs.filter(p=>p.estado!=="Respondida").length;
  const pend=S.reservas.filter(r=>r.estado==="Pendiente").length;
  document.getElementById("nav").innerHTML=VIEWS[S.role].map(([k,l])=>{
    let b="";
    if(S.role==="adm"&&k==="pqrs"&&abiertas)b=`<span class="badge">${abiertas}</span>`;
    if(S.role==="adm"&&k==="reservas"&&pend)b=`<span class="badge">${pend}</span>`;

}

  const adm=S.role==="adm";
  const franjas=["8:00 a. m. a 12:00 m.","10:00 a. m. a 2:00 p. m.","2:00 p. m. a 6:00 p. m.","6:00 p. m. a 10:00 p. m."];
  const z=R._z||S.zonas[0],f=R._f||addDays(1);
  const ocup=S.reservas.filter(r=>r.zona===z&&r.fecha===f&&r.estado!=="Rechazada").map(r=>r.franja);
  const lista=(adm?S.reservas:S.reservas.filter(r=>r.unidad===UNIT)).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return head("Reservas de zonas comunes",adm?"Apruebe o rechace las solicitudes de los residentes.":"Elija zona, fecha y franja. La administración confirma la reserva.")+
  `<div class="grid g2">
  ${adm?"":`<div class="panel"><h2>Nueva reserva</h2>
    <label for="rZona">Zona</label><select id="rZona">${S.zonas.map(x=>`<option ${x===z?"selected":""}>${x}</option>`).join("")}</select>
    <label for="rFecha">Fecha</label><input type="date" id="rFecha" min="${today()}" value="${f}">
    <label>Franja</label><div class="slots">${franjas.map(fr=>{const t=ocup.includes(fr);return `<button class="slot ${t?"taken":""} ${R._s===fr?"sel":""}" ${t?"disabled":""} data-slot="${fr}">${fr}</button>`}).join("")}</div>
    <div style="margin-top:16px"><button class="btn" data-act="reservar" ${R._s?"":"disabled"}>Solicitar reserva</button></div></div>`}
  <div class="panel"><h2>${adm?"Todas las reservas":"Mis reservas"}</h2><div class="list">${lista.map(r=>`<div class="item"><div><div class="t">${esc(r.zona)}</div><div class="m">${fdate(r.fecha)}, ${esc(r.franja)}${adm?"<br>"+esc(r.unidad):""}</div></div><div class="row">${pillEstado(r.estado)}${adm&&r.estado==="Pendiente"?`<button class="btn sm" data-res="${r.id}" data-st="Aprobada">Aprobar</button><button class="btn sm ghost" data-res="${r.id}" data-st="Rechazada">Rechazar</button>`:""}${!adm&&r.estado==="Pendiente"?`<button class="btn sm ghost" data-cancel="${r.id}">Cancelar</button>`:""}</div></div>`).join("")||`<div class="empty">No hay reservas.</div>`}</div></div>
  </div>`;
},
pqrs(){
  const adm=S.role==="adm";
  const lista=adm?S.pqrs:S.pqrs.filter(p=>p.unidad===UNIT);
  return head("PQRS",adm?"Gestione peticiones, quejas, reclamos y sugerencias con trazabilidad.":"Radique su solicitud y siga su estado hasta la respuesta.")+
  `<div class="grid g2">
  ${adm?"":`<div class="panel"><h2>Radicar solicitud</h2>
    <label for="qTipo">Tipo</label><select id="qTipo"><option>Petición</option><option>Queja</option><option>Reclamo</option><option>Sugerencia</option></select>
    <label for="qAs">Asunto</label><input id="qAs" maxlength="90">
    <label for="qTx">Descripción</label><textarea id="qTx"></textarea>
    <div style="margin-top:14px"><button class="btn" data-act="radicar">Radicar</button></div></div>`}
  <div class="panel"><h2>${adm?"Bandeja":"Mis solicitudes"}</h2><div class="list">${lista.map(p=>`<div class="item"><div style="flex:1"><div class="row"><span class="t">${esc(p.asunto)}</span><span class="pill p-info">${esc(p.tipo)}</span></div><div class="m">${p.rad}, ${fdate(p.fecha)}${adm?", "+esc(p.unidad):""}</div><div style="margin-top:4px">${esc(p.texto)}</div>${p.resp?`<div style="margin-top:8px;padding:10px;background:var(--primary-soft);border-radius:var(--r-sm)"><b>Respuesta:</b> ${esc(p.resp)}</div>`:""}${adm&&p.estado!=="Respondida"?`<div class="row" style="margin-top:8px">${p.estado==="Radicada"?`<button class="btn sm ghost" data-tram="${p.id}">Pasar a trámite</button>`:""}<button class="btn sm" data-resp="${p.id}">Responder</button></div>`:""}</div>${pillEstado(p.estado)}</div>`).join("")||`<div class="empty">No hay solicitudes.</div>`}</div></div>
  </div>`;
},
cuenta(){
  const saldo=S.cuenta.filter(c=>c.estado!=="Pagado").reduce((a,c)=>a+c.valor,0);
  return head("Estado de cuenta",UNIT+". Cuota de administración de prueba.")+
  `<div class="panel"><div class="tablewrap"><table><thead><tr><th>Periodo</th><th class="num">Valor</th><th>Estado</th></tr></thead><tbody>${S.cuenta.map(c=>`<tr><td>${c.per}</td><td class="num">${fmt(c.valor)}</td><td>${pillEstado(c.estado)}</td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="justify-content:space-between;margin-top:16px"><b>Saldo: ${fmt(saldo)}</b>${saldo?`<button class="btn" data-act="pagar">Pagar con PSE</button>`:`<span class="pill p-ok">Al día</span>`}</div></div>`;
},
cartera(){
  const c=S.cartera;
  return head("Cartera","Indicadores generales. En la plataforma real se alimenta de la contabilidad del conjunto.")+
  `<div class="grid g4" style="margin-bottom:16px"><div class="panel kpi"><div class="n">${Math.round(c.recaudo*100)}%</div><div class="l">Recaudo del mes</div></div><div class="panel kpi"><div class="n">${c.unidades-c.mora}</div><div class="l">Unidades al día</div></div><div class="panel kpi"><div class="n">${c.mora}</div><div class="l">Unidades en mora</div></div></div>
  <div class="panel"><h2>Recaudo del mes</h2><div class="bar" style="height:16px"><i style="width:${c.recaudo*100}%"></i></div><p class="m" style="color:var(--muted);font-size:13px;margin:0">El detalle por unidad solo es visible para administración y revisoría, en cumplimiento de la Ley 1581 de 2012.</p></div>`;
},
visitantes(){
  const mias=S.visitas.filter(v=>v.unidad===UNIT);
  return head("Visitantes","Autorice a sus visitas por adelantado. Portería valida el código al ingreso.")+
  `<div class="grid g2"><div class="panel"><h2>Autorizar visita</h2>
    <label for="vNom">Nombre del visitante</label><input id="vNom" maxlength="60">
    <label for="vFec">Fecha</label><input type="date" id="vFec" min="${today()}" value="${today()}">
    <div style="margin-top:14px"><button class="btn" data-act="autorizar">Generar código</button></div></div>
  <div class="panel"><h2>Visitas autorizadas</h2><div class="list">${mias.map(v=>`<div class="item"><div><div class="t">${esc(v.nombre)}</div><div class="m">${fdate(v.fecha)}</div><div class="code">${v.codigo}</div></div>${v.ingreso?pillEstado("Aprobada").replace("Aprobada","Ingresó"):`<span class="pill p-info">Esperando</span>`}</div>`).join("")||`<div class="empty">Sin visitas autorizadas.</div>`}</div></div></div>`;
},
porteria(){
  return head("Portería","Validación de visitantes autorizados por los residentes.")+
  `<div class="grid g2"><div class="panel"><h2>Validar código</h2><label for="pCod">Código de 6 dígitos</label><input id="pCod" inputmode="numeric" maxlength="6"><div style="margin-top:14px"><button class="btn" data-act="validar">Validar ingreso</button></div></div>
  <div class="panel"><h2>Visitas del día y próximas</h2><div class="list">${S.visitas.map(v=>`<div class="item"><div><div class="t">${esc(v.nombre)}</div><div class="m">${esc(v.unidad)}, ${fdate(v.fecha)}</div></div>${v.ingreso?`<span class="pill p-ok">Ingresó</span>`:`<span class="pill p-info">Esperando</span>`}</div>`).join("")||`<div class="empty">Sin visitas.</div>`}</div></div></div>`;
},
votaciones(){
  const v=S.votacion,adm=S.role==="adm",tot=Object.values(v.opciones).reduce((a,b)=>a+b,0);
  return head("Votaciones y encuestas","Consultas a la comunidad. Las decisiones de asamblea en la plataforma real se ponderan por coeficiente de copropiedad.")+
  `<div class="grid g2"><div class="panel"><h2>${esc(v.pregunta)}</h2>
  ${!adm&&!v.votada&&v.abierta?`<div class="list">${Object.keys(v.opciones).map(o=>`<button class="btn ghost" style="margin:4px 0;text-align:left" data-voto="${esc(o)}">${esc(o)}</button>`).join("")}</div>`:
  Object.entries(v.opciones).map(([o,n])=>`<div class="row" style="justify-content:space-between"><span>${esc(o)}</span><b>${n} (${tot?Math.round(n/tot*100):0}%)</b></div><div class="bar"><i style="width:${tot?n/tot*100:0}%"></i></div>`).join("")+`<div class="m" style="color:var(--muted);font-size:13px">${tot} votos${v.votada&&!adm?". Su voto quedó registrado.":""}</div>`}
  ${adm?`<div class="row" style="margin-top:14px"><button class="btn sm ghost" data-act="cerrarVot">${v.abierta?"Cerrar votación":"Reabrir votación"}</button></div>`:""}
  </div>
  ${adm?`<div class="panel"><h2>Nueva consulta</h2><label for="nvP">Pregunta</label><input id="nvP" maxlength="140"><label for="nvO">Opciones separadas por coma</label><input id="nvO" value="Sí, No, Me abstengo"><div style="margin-top:14px"><button class="btn" data-act="nuevaVot">Publicar consulta</button></div></div>`:""}</div>`;
},
documentos(){
  return head("Documentos","Reglamento, actas, informes financieros y políticas del conjunto.")+
  `<div class="panel"><div class="list">${S.docs.map(d=>`<div class="item"><div class="t">${esc(d)}</div><button class="btn sm ghost" data-doc="${esc(d)}">Ver</button></div>`).join("")}</div></div>`;
}
};

function render(){
  if(!VIEWS[S.role].some(([k])=>k===S.view))S.view=VIEWS[S.role][0][0];
  renderNav();
  document.getElementById("main").innerHTML=R[S.view]();
  save();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.role){S.role=d.role;S.view=VIEWS[S.role][0][0];render();return}
  if(d.v){S.view=d.v;render();window.scrollTo(0,0);return}
  if(d.go){S.view=d.go;render();return}
  if(d.slot){R._s=d.slot;render();return}
  if(d.res){const r=S.reservas.find(x=>x.id==d.res);r.estado=d.st;render();toast("Reserva "+d.st.toLowerCase());return}
  if(d.cancel){S.reservas=S.reservas.filter(x=>x.id!=d.cancel);render();toast("Reserva cancelada");return}
  if(d.tram){S.pqrs.find(x=>x.id==d.tram).estado="En trámite";render();toast("Solicitud en trámite");return}
  if(d.resp){modal(`<h2>Responder solicitud</h2><label for="mResp">Respuesta al residente</label><textarea id="mResp"></textarea><div class="row" style="margin-top:14px"><button class="btn" data-sendresp="${d.resp}">Enviar respuesta</button><button class="btn ghost" data-close>Cancelar</button></div>`);return}
  if(d.sendresp){const t=document.getElementById("mResp").value.trim();if(!t){toast("Escriba la respuesta antes de enviar");return}const p=S.pqrs.find(x=>x.id==d.sendresp);p.resp=t;p.estado="Respondida";closeModal();render();toast("Respuesta enviada");return}
  if(d.close!==undefined){closeModal();return}
  if(d.voto){S.votacion.opciones[d.voto]++;S.votacion.votada=true;render();toast("Voto registrado");return}
  if(d.doc){toast("Documento de ejemplo. En la plataforma real se abre el PDF.");return}
  const act=d.act;
  if(act==="pagar"){modal(`<h2>Pago con PSE</h2><p>En la plataforma real este botón lleva a la pasarela de pagos del convenio bancario del conjunto.</p><p class="m" style="color:var(--muted)">En el prototipo puede simular el pago para ver cómo se actualiza el estado de cuenta.</p><div class="row"><button class="btn" data-simpago>Simular pago</button><button class="btn ghost" data-close>Cerrar</button></div>`);}
  if(b.hasAttribute("data-simpago")){S.cuenta.forEach(c=>c.estado="Pagado");closeModal();render();toast("Pago registrado");}
  if(act==="pubCom"){const t=document.getElementById("cTit").value.trim(),x=document.getElementById("cTxt").value.trim();if(!t||!x){toast("Complete título y texto para publicar");return}S.comunicados.unshift({id:++S.seq.id,fecha:today(),titulo:t,texto:x,cat:document.getElementById("cCat").value});render();toast("Comunicado publicado");}
  if(act==="reservar"){const z=document.getElementById("rZona").value,f=document.getElementById("rFecha").value;S.reservas.push({id:++S.seq.id,zona:z,fecha:f,franja:R._s,unidad:UNIT,estado:"Pendiente"});R._s=null;render();toast("Reserva solicitada. Queda pendiente de aprobación.");}
  if(act==="radicar"){const a=document.getElementById("qAs").value.trim(),t=document.getElementById("qTx").value.trim();if(!a||!t){toast("Complete asunto y descripción para radicar");return}const rad="PQ-"+String(S.seq.pq++).padStart(4,"0");S.pqrs.unshift({id:++S.seq.id,rad,tipo:document.getElementById("qTipo").value,asunto:a,texto:t,unidad:UNIT,fecha:today(),estado:"Radicada",resp:""});render();toast("Solicitud radicada con número "+rad);}
  if(act==="autorizar"){const n=document.getElementById("vNom").value.trim();if(!n){toast("Escriba el nombre del visitante");return}const c=String(Math.floor(100000+Math.random()*900000));S.visitas.unshift({id:++S.seq.id,nombre:n,fecha:document.getElementById("vFec").value,codigo:c,unidad:UNIT,ingreso:false});render();toast("Código generado: "+c);}
  if(act==="validar"){const c=document.getElementById("pCod").value.trim();const v=S.visitas.find(x=>x.codigo===c);if(!v){toast("Código no encontrado. Verifique con el residente.");return}if(v.ingreso){toast("Ese código ya fue usado");return}v.ingreso=true;render();toast("Ingreso autorizado: "+v.nombre+" a "+v.unidad);}
  if(act==="cerrarVot"){S.votacion.abierta=!S.votacion.abierta;render();toast(S.votacion.abierta?"Votación reabierta":"Votación cerrada");}
  if(act==="nuevaVot"){const p=document.getElementById("nvP").value.trim(),o=document.getElementById("nvO").value.split(",").map(s=>s.trim()).filter(Boolean);if(!p||o.length<2){toast("Escriba la pregunta y al menos dos opciones");return}S.votacion={pregunta:p,opciones:Object.fromEntries(o.map(x=>[x,0])),votada:false,abierta:true};render();toast("Consulta publicada");}
});
document.addEventListener("change",e=>{
  if(e.target.id==="rZona"){R._z=e.target.value;R._s=null;render()}
  if(e.target.id==="rFecha"){R._f=e.target.value;R._s=null;render()}
});
document.getElementById("reset").addEventListener("click",()=>{S=seed();R._s=R._z=R._f=null;render();toast("Datos de prueba restablecidos")});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset,H=S.hogar;
  const cambio=(desc,ref)=>S.cambios.unshift({id:++S.seq.id,unidad:UNIT,desc,fecha:today(),ref});
  if(d.act==="autorizaDatos"){if(!document.getElementById("hAut").checked){toast("Marque la casilla de autorización para continuar");return}H.autoriza=true;render();toast("Autorización registrada")}
  if(d.act==="guardarContacto"){const g=id=>document.getElementById(id).value.trim();if(!g("hNom")||!g("hTel")){toast("Nombre y celular son obligatorios");return}H.contacto={calidad:g("hCal"),nombre:g("hNom"),tel:g("hTel"),correo:g("hCor"),emerg:g("hEme")};H.actualizado=today();render();toast("Datos guardados")}
  if(d.act==="confirmarDatos"){H.actualizado=today();render();toast("Datos confirmados")}
  if(d.add==="hab")modal(`<h2>Agregar habitante</h2><label for="aNom">Nombre completo</label><input id="aNom"><label for="aRel">Parentesco o relación</label><select id="aRel"><option>Cónyuge o pareja</option><option>Hijo(a)</option><option>Padre o madre</option><option>Otro familiar</option><option>Arrendatario</option><option>Personal de servicio</option></select><label style="display:flex;gap:8px;color:var(--ink);font-weight:500;margin-top:14px"><input type="checkbox" id="aMen" style="width:auto"> Es menor de edad</label><div class="row" style="margin-top:14px"><button class="btn" data-save="hab">Agregar</button><button class="btn ghost" data-close>Cancelar</button></div>`);
  if(d.add==="mas")modal(`<h2>Agregar mascota</h2><label for="mNom">Nombre</label><input id="mNom"><label for="mEsp">Especie</label><select id="mEsp"><option>Perro</option><option>Gato</option><option>Otra</option></select><label for="mRaz">Raza</label><input id="mRaz"><label for="mVac">Fecha de la última vacuna antirrábica</label><input type="date" id="mVac" max="${today()}"><label style="display:flex;gap:8px;color:var(--ink);font-weight:500;margin-top:14px"><input type="checkbox" id="mPpp" style="width:auto"> Canino potencialmente peligroso</label><label for="mPol">Número de póliza (si aplica)</label><input id="mPol"><div class="row" style="margin-top:14px"><button class="btn" data-save="mas">Agregar</button><button class="btn ghost" data-close>Cancelar</button></div>`);
  if(d.add==="veh")modal(`<h2>Agregar vehículo</h2><label for="vPla">Placa</label><input id="vPla" maxlength="7" style="text-transform:uppercase"><label for="vTip">Tipo</label><select id="vTip"><option>Automóvil</option><option>Camioneta</option><option>Motocicleta</option><option>Bicicleta</option></select><label for="vMar">Marca</label><input id="vMar"><label for="vCol">Color</label><input id="vCol"><label for="vPar">Parqueadero asignado</label><input id="vPar"><div class="row" style="margin-top:14px"><button class="btn" data-save="veh">Agregar</button><button class="btn ghost" data-close>Cancelar</button></div>`);
  if(d.save){const g=id=>document.getElementById(id).value.trim();const id=++S.seq.id;
    if(d.save==="hab"){if(!g("aNom")){toast("Escriba el nombre");return}H.habitantes.push({id,nombre:g("aNom"),rel:g("aRel"),menor:document.getElementById("aMen").checked,estado:"Pendiente"});cambio("Nuevo habitante: "+g("aNom"),"habitantes:"+id)}
    if(d.save==="mas"){if(!g("mNom")||!g("mVac")){toast("Nombre y fecha de vacuna son obligatorios");return}H.mascotas.push({id,nombre:g("mNom"),especie:g("mEsp"),raza:g("mRaz")||"Sin especificar",vacuna:g("mVac"),ppp:document.getElementById("mPpp").checked,poliza:g("mPol"),estado:"Pendiente"});cambio("Nueva mascota: "+g("mNom"),"mascotas:"+id)}
    if(d.save==="veh"){const pl=g("vPla").toUpperCase().replace(/[^A-Z0-9]/g,"");if(pl.length<5){toast("Escriba una placa válida");return}H.vehiculos.push({id,placa:pl,tipo:g("vTip"),marca:g("vMar")||"Sin especificar",color:g("vCol")||"Sin especificar",parq:g("vPar"),estado:"Pendiente"});cambio("Nuevo vehículo: "+pl,"vehiculos:"+id)}
    H.actualizado=today();closeModal();render();toast("Registrado. Queda pendiente de validación por la administración.")}
  if(d.del){const[k,id]=d.del.split(":");H[k]=H[k].filter(x=>x.id!=id);S.cambios=S.cambios.filter(c=>c.ref!==d.del);H.actualizado=today();render();toast("Registro retirado")}
  if(d.val){const c=S.cambios.find(x=>x.id==d.val);if(c){const[k,id]=c.ref.split(":");if(d.ok==="1"){const it=H[k].find(x=>x.id==id);if(it)it.estado="Validado";toast("Cambio validado")}else{H[k]=H[k].filter(x=>x.id!=id);toast("Cambio rechazado")}S.cambios=S.cambios.filter(x=>x!==c);render()}}
  if(d.act==="buscarPlaca"){const pl=document.getElementById("cPla").value.toUpperCase().replace(/[^A-Z0-9]/g,"");const todas=[{unidad:UNIT,placas:H.vehiculos.filter(v=>v.estado==="Validado").map(v=>v.placa)},...S.censo];const f=todas.find(x=>x.placas.includes(pl));document.getElementById("resPla").innerHTML=f?`<span class="pill p-ok">Registrada: ${esc(f.unidad)}</span>`:`<span class="pill p-bad">Placa no registrada. Tratar como visitante.</span>`}
});

migrar();render();
</script>
</body>
</html>
